<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboards - ChessPeps</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="leaderboards.css">
</head>
<body>
    <!-- ── Nav ── -->
    <nav class="nav">
        <a href="/" class="nav-logo">
            <div class="nav-logo-icon">♟</div>
            chesspeps
        </a>
        <ul class="nav-links">
            <li><a href="/openings.html">Trainer</a></li>
            <li><a href="/plans.html">Pricing</a></li>
            <li><a href="/leaderboards.html" class="active">Leaderboards</a></li>
        </ul>
        <div class="nav-right">
            <button class="btn btn-primary" onclick="location.href='/signup.html'">Get Started</button>
        </div>
    </nav>

    <main class="leaderboards-section">
        <header class="leaderboards-header">
            <h1 class="leaderboards-title">Global Rankings</h1>
            <p class="leaderboards-lede">The top tacticians and opening specialists this week.</p>
        </header>
        
        <div class="table-wrapper">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th class="rank-cell">Rank</th>
                        <th>Player</th>
                        <th>Highest Streak</th>
                        <th class="score-cell">Puzzle ELO</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--color-muted);">Loading rankings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="site-footer" style="padding: 2rem 1rem; text-align: center; border-top: 1px solid var(--color-rule); margin-top: 4rem;">
        <p style="color: var(--color-muted); font-size: var(--text-xs);">© 2026 ChessPeps. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script type="module" src="/modules/leaderboards.js"></script>
</body>
</html>
