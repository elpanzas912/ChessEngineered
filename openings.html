<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chesspeps — Repertoire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #07070a;
            --surface:  #0f0f14;
            --border:   #1e1e28;
            --border-h: #d4a843;
            --gold:     #d4a843;
            --gold-dim: #d4a84344;
            --gold-faint:#d4a84318;
            --cream:    #f2e8d5;
            --muted:    #54546a;
            --muted2:   #38384a;
            --white-badge: #e8e8e8;
            --black-badge: #ffd06a;
            --purple:   #8b6fc4;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--cream);
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

        /* ─── NAV ─── */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(7,7,10,.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .08em;
            color: var(--cream);
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 28px; height: 28px;
            background: var(--gold);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            line-height: 1;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            font-size: 11px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color .2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--cream); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-user {
            font-size: 11px;
            letter-spacing: .06em;
            color: var(--muted);
        }

        .nav-avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--purple);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .btn-logout, .btn-login {
            font-family: inherit;
            font-size: 10px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 5px 12px;
            cursor: pointer;
            transition: border-color .2s, color .2s;
        }
        .btn-logout:hover, .btn-login:hover { border-color: var(--muted); color: var(--cream); }

        /* ─── HERO ─── */
        .hero {
            position: relative;
            padding-top: 56px;
            height: 360px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Banner image bg */
        .hero-bg {
            position: absolute;
            inset: 0;
            background: url('img/banner.png') center -195px / cover no-repeat;
            z-index: 0;
        }

        /* Fade overlay */
        .hero-bg-fade {
            position: absolute;
            bottom: -20px;
            left: 0;
            right: 0;
            height: 300px;
            background: linear-gradient(to bottom, rgba(7,7,10,0) 0%, rgba(7,7,10,0.7) 60%, var(--bg) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Noise grain */
        .hero-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 200px;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Piece silhouettes */
        .hero-pieces {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 100%;
            pointer-events: none;
        }

        .hero-piece {
            position: absolute;
            bottom: -10px;
            font-size: 180px;
            line-height: 1;
            opacity: 0.055;
            filter: blur(0.5px);
            transition: opacity 1s;
        }
        .hp-1 { left: 2%;  font-size: 140px; opacity: 0.04; }
        .hp-2 { left: 10%; font-size: 200px; }
        .hp-3 { right: 12%; font-size: 190px; }
        .hp-4 { right: 2%;  font-size: 130px; opacity: 0.04; }

        /* Horizontal rule accent */
        .hero-rule {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border) 20%, var(--border) 80%, transparent);
        }

        .hero-content {
            position: relative;
            text-align: center;
            z-index: 1;
        }

        .hero-eyebrow {
            font-size: 9px;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 6vw, 5.5rem);
            font-weight: 700;
            line-height: 1;
            color: var(--cream);
            margin-bottom: 18px;
        }

        .hero-title em {
            font-style: italic;
            color: var(--gold);
        }

        .hero-sub {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: .04em;
            line-height: 1.8;
            max-width: 420px;
            margin: 0 auto;
        }

        /* ─── MAIN ─── */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 40px 80px;
        }

        /* ─── TOOLBAR ─── */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 3px;
            padding: 7px 16px;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn:hover { border-color: var(--muted); color: var(--cream); }
        .filter-btn.active {
            background: var(--gold-faint);
            border-color: var(--gold);
            color: var(--gold);
        }

        .filter-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
            margin-left: 8px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            font-size: 12px;
            color: var(--muted2);
            pointer-events: none;
        }

        .search-input {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--cream);
            border-radius: 3px;
            padding: 8px 16px 8px 34px;
            width: 240px;
            outline: none;
            letter-spacing: .04em;
            transition: border-color .2s, box-shadow .2s;
        }
        .search-input::placeholder { color: var(--muted2); }
        .search-input:focus {
            border-color: var(--gold-dim);
            box-shadow: 0 0 0 3px var(--gold-faint);
        }

        .toolbar-right {
            font-size: 10px;
            color: var(--muted2);
            letter-spacing: .08em;
        }
        .toolbar-right strong { color: var(--muted); }

        /* ─── SECTION LABEL ─── */
        .section-label {
            font-size: 9px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--muted2);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ─── GRID ─── */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* ─── CARD ─── */
        .card {
            position: relative;
            display: flex;
            height: 152px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: border-color .3s, transform .3s cubic-bezier(.22,.68,0,1.2), box-shadow .3s;
        }

        .card:hover {
            border-color: var(--border-h);
            transform: translateY(-3px) scale(1.006);
            box-shadow: 0 16px 40px rgba(0,0,0,.6), 0 0 0 1px #d4a84322;
        }

        /* Board thumb */
        .card-thumb {
            flex-shrink: 0;
            width: 150px;
            position: relative;
            overflow: hidden;
            background: var(--surface);
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: opacity 0.35s;
        }
        .card:hover .card-thumb img {
            opacity: 0.95;
        }

        /* Fade right */
        .card-thumb-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent 40%, var(--surface) 100%);
            pointer-events: none;
        }

        /* Piece on board */
        .card-thumb-piece {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            opacity: 0.15;
            filter: drop-shadow(0 0 18px rgba(212,168,67,0.4));
            transition: opacity .3s, transform .3s;
            user-select: none;
            pointer-events: none;
        }
        .card:hover .card-thumb-piece { opacity: 0.3; filter: drop-shadow(0 0 28px rgba(212,168,67,0.6)); }

        /* Content */
        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 18px 14px;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        .card-shimmer {
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 30%, rgba(212,168,67,.03) 50%, transparent 70%);
            background-size: 200% 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .card:hover .card-shimmer { opacity: 1; animation: shimmer 2.2s infinite; }
        @keyframes shimmer { from{background-position:200% 0} to{background-position:-200% 0} }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--cream);
            line-height: 1.15;
            flex: 1;
            min-width: 0;
        }

        .badge {
            flex-shrink: 0;
            font-size: 8px;
            letter-spacing: .14em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 2px;
            margin-top: 2px;
        }
        .badge-white {
            background: #f2f2f215;
            border: 1px solid #f2f2f230;
            color: #d8d8d8;
        }
        .badge-black {
            background: var(--gold-faint);
            border: 1px solid var(--gold-dim);
            color: var(--gold);
        }

        .card-desc {
            font-size: 10.5px;
            line-height: 1.65;
            color: var(--muted);
            letter-spacing: .01em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color .2s;
        }
        .card:hover .card-desc { color: #78788e; }

        .card-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-progress-wrap {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            margin-right: 20px;
        }

        .card-lines {
            font-size: 9px;
            color: var(--muted2);
            letter-spacing: .1em;
            text-align: right;
        }
        .card-lines strong { color: var(--muted); }

        .progress-track {
            height: 3px;
            background: #222230;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #7c5cbf, var(--gold));
            border-radius: 99px;
            transition: width 0.6s cubic-bezier(.22,.68,0,1.2);
        }

        .card-cta {
            font-size: 9px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity .25s, transform .25s;
        }
        .card:hover .card-cta { opacity: 1; transform: translateX(0); }

        .cta-arrow { display: inline-block; transition: transform .25s; }
        .card:hover .cta-arrow { transform: translateX(3px); }

        /* Corner accent */
        .card-corner-tl {
            position: absolute;
            top: 0; left: 0;
            width: 40px; height: 40px;
            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s;
        }
        .card:hover .card-corner-tl { opacity: 0.5; }

        /* ─── AUTH MODAL ─── */
        .auth-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .auth-modal-overlay.open {
            display: flex;
        }

        .auth-modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        .auth-modal h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
            color: var(--cream);
        }

        .auth-modal .form-group {
            margin-bottom: 16px;
        }

        .auth-modal label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .auth-modal input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--cream);
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            outline: none;
            transition: border-color 0.15s;
        }

        .auth-modal input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-faint);
        }

        .auth-modal .btn-auth {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            border: none;
            border-radius: 3px;
            color: #000;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 8px;
        }

        .auth-modal .btn-auth:hover {
            background: #c49a3a;
        }

        .auth-modal .auth-toggle {
            text-align: center;
            margin-top: 16px;
            font-size: 11px;
            color: var(--muted);
        }

        .auth-modal .auth-toggle a {
            color: var(--gold);
            cursor: pointer;
            text-decoration: underline;
        }

        .auth-modal .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.15s;
        }
        .auth-modal .close-btn:hover { color: var(--cream); }

        .auth-modal .error-msg {
            color: #ef4444;
            font-size: 11px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        @media (max-width: 768px) {
            nav { padding: 0 20px; }
            .nav-links { gap: 20px; }
            .nav-links a { font-size: 10px; }
            main { padding: 24px 20px 60px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar-left { flex-wrap: wrap; }
            .search-input { width: 100%; }
            .search-wrap { margin-left: 0; margin-top: 8px; width: 100%; }
            .hero-title { font-size: clamp(2.2rem, 8vw, 3.5rem); }
        }
    </style>
</head>
<body>

    <!-- ── NAV ── -->
    <nav>
        <a href="/openings.html" class="nav-logo">
            <div class="nav-logo-icon">♟</div>
            chesspeps
        </a>

        <ul class="nav-links">
            <li><a href="/openings.html" class="active">Repertoire</a></li>
            <li><a href="/index.html">Trainer</a></li>
        </ul>

        <div class="nav-right" id="userMenu">
            <button class="btn-login" id="btnLogin" onclick="openAuthModal()">Log in</button>
        </div>
    </nav>

    <!-- ── HERO ── -->
    <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-bg-fade"></div>
        <div class="hero-pieces">
            <span class="hero-piece hp-1">♜</span>
            <span class="hero-piece hp-2">♚</span>
            <span class="hero-piece hp-3">♞</span>
            <span class="hero-piece hp-4">♟</span>
        </div>
        <div class="hero-rule"></div>

        <div class="hero-content">
            <p class="hero-eyebrow">Chess Opening Repertoire</p>
            <h1 class="hero-title">Master the<br><em>Opening</em></h1>
            <p class="hero-sub">Practice your openings with interactive<br>move-by-move training.</p>
        </div>
    </div>

    <!-- ── MAIN ── -->
    <main>
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="filter-btn active" data-color="all" onclick="toggleColorFilter(this)">All</button>
                <button class="filter-btn" data-color="white" onclick="toggleColorFilter(this)">
                    <span class="filter-dot" style="background:#e8e8e8"></span> White
                </button>
                <button class="filter-btn" data-color="black" onclick="toggleColorFilter(this)">
                    <span class="filter-dot" style="background:#d4a843"></span> Black
                </button>
                <div class="search-wrap">
                    <span class="search-icon">⌕</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search openings…">
                </div>
            </div>
            <div class="toolbar-right">
                <strong id="countOpenings">28</strong> openings · <strong id="countLines">0</strong> lines
            </div>
        </div>

        <div class="section-label" id="sectionLabel">All openings</div>

        <div class="grid" id="courseGrid"></div>
    </main>

    <!-- ── AUTH MODAL ── -->
    <div class="auth-modal-overlay" id="authModal">
        <div class="auth-modal">
            <button class="close-btn" onclick="closeAuthModal()">×</button>
            <h2 id="authTitle">Log in</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="authEmail" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="••••••••">
            </div>
            <button class="btn-auth" id="authBtn" onclick="handleAuth()">Log in</button>
            <div style="text-align:center;margin:16px 0;color:var(--muted);font-size:0.85rem;">or</div>
            <button class="btn-auth" style="background:#4285F4;border:none;" onclick="handleGoogleAuth()">
                <span style="margin-right:8px;">🔍</span> Continue with Google
            </button>
            <div class="error-msg" id="authError"></div>
            <div class="auth-toggle">
                <span id="authToggleText">Don't have an account?</span>
                <a onclick="toggleAuthMode()" id="authToggleLink">Sign up</a>
            </div>
        </div>
    </div>

    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        let allOpenings = {};
        let currentColorFilter = 'all';
        let authMode = 'login';
        let supabaseClient = null;
        let auth = null;

        // Initialize Supabase
        try {
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                supabaseClient = supabase.createClient(
                    'https://mvvnqkixgxjblgyrnvte.supabase.co',
                    'sb_publishable_oTugIxx-nIZDcJgCuMnnqw_1ppfExp9'
                );
                auth = supabaseClient.auth;
            } else {
                throw new Error('Supabase library not loaded');
            }
        } catch (err) {
            document.getElementById('authError').textContent = 'Connection error. Please refresh.';
        }

        // Fetch openings
        fetch('data/openings.json')
            .then(r => r.json())
            .then(data => {
                allOpenings = data.openings || {};
                renderCourses(allOpenings);
            })
            .catch(err => { /* ignore */ });

        function renderCourses(openings) {
            const grid = document.getElementById('courseGrid');
            grid.innerHTML = '';

            let entries = Object.entries(openings).sort((a, b) => a[1].displayName.localeCompare(b[1].displayName));

            // Apply color filter
            if (currentColorFilter !== 'all') {
                entries = entries.filter(([, o]) => o.playerSide === currentColorFilter[0]);
            }

            // Apply search filter
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                entries = entries.filter(([, o]) => {
                    const name = o.displayName.toLowerCase();
                    const desc = o.descriptions ? Object.values(o.descriptions)[0].toLowerCase() : '';
                    return name.includes(searchTerm) || desc.includes(searchTerm);
                });
            }

            const totalLines = entries.reduce((sum, [, o]) => sum + (o.lines?.length || 0), 0);
            document.getElementById('countOpenings').textContent = entries.length;
            document.getElementById('countLines').textContent = totalLines;

            // Update section label
            const labels = { all: 'All openings', white: 'White openings', black: 'Black openings' };
            let labelText = labels[currentColorFilter];
            if (searchTerm) labelText += ` · "${searchTerm}"`;
            document.getElementById('sectionLabel').textContent = labelText;

            entries.forEach(([slug, o]) => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `opening.html?slug=${slug}`;
                card.setAttribute('aria-label', o.displayName);
                card.dataset.side = o.playerSide === 'w' ? 'white' : 'black';

                const side = o.playerSide === 'w' ? 'white' : 'black';
                const sideLabel = o.playerSide === 'w' ? 'White' : 'Black';
                const lineCount = o.lines?.length || 0;
                const desc = o.descriptions ? Object.values(o.descriptions)[0] : '';
                const shortDesc = desc ? desc.substring(0, 120) + (desc.length > 120 ? '...' : '') : 'Practice this opening with interactive training.';

                // Calculate progress
                let learnedCount = 0;
                try {
                    const progress = JSON.parse(localStorage.getItem('chesspeps_progress') || '{}');
                    learnedCount = progress[slug]?.learnedLines?.length || 0;
                } catch (e) { /* ignore */ }
                const pct = lineCount > 0 ? Math.round((learnedCount / lineCount) * 100) : 0;

                // Get piece emoji based on opening side
                const pieceEmoji = o.playerSide === 'w' ? '♙' : '♟';

                card.innerHTML = `
                    <div class="card-thumb">
                        <img src="boards/${slug}.png" alt="${o.displayName} board">
                        <div class="card-thumb-fade"></div>
                        <div class="card-thumb-piece">${pieceEmoji}</div>
                    </div>
                    <div class="card-body">
                        <div class="card-shimmer"></div>
                        <div class="card-corner-tl"></div>
                        <div class="card-top">
                            <h2 class="card-title">${o.displayName}</h2>
                            <span class="badge badge-${side}">${sideLabel}</span>
                        </div>
                        <p class="card-desc">${shortDesc}</p>
                        <div class="card-foot">
                            <div class="card-progress-wrap">
                                <span class="card-lines"><strong>${learnedCount}/${lineCount}</strong> lines</span>
                                <div class="progress-track">
                                    <div class="progress-fill" style="width: ${pct}%"></div>
                                </div>
                            </div>
                            <span class="card-cta">Start training <span class="cta-arrow">→</span></span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function toggleColorFilter(btn) {
            document.querySelectorAll('.filter-btn').forEach(f => f.classList.remove('active'));
            btn.classList.add('active');
            currentColorFilter = btn.dataset.color;
            renderCourses(allOpenings);
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            renderCourses(allOpenings);
        });

        // Auth Modal Controls
        function openAuthModal() {
            document.getElementById('authModal').classList.add('open');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('open');
            document.getElementById('authError').style.display = 'none';
        }

        function toggleAuthMode() {
            authMode = authMode === 'login' ? 'signup' : 'login';
            document.getElementById('authTitle').textContent = authMode === 'login' ? 'Log in' : 'Sign up';
            document.getElementById('authBtn').textContent = authMode === 'login' ? 'Log in' : 'Sign up';
            document.getElementById('authToggleText').textContent = authMode === 'login' ? "Don't have an account?" : 'Already have an account?';
            document.getElementById('authToggleLink').textContent = authMode === 'login' ? 'Sign up' : 'Log in';
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAuthModal();
        });

        // Close modal on overlay click
        document.getElementById('authModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('authModal')) closeAuthModal();
        });

        // Auth handlers
        async function handleAuth() {
            if (!supabaseClient) {
                document.getElementById('authError').textContent = 'Not connected. Refresh the page.';
                document.getElementById('authError').style.display = 'block';
                return;
            }

            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const errorEl = document.getElementById('authError');

            if (!email || !password) {
                errorEl.textContent = 'Please enter email and password';
                errorEl.style.display = 'block';
                return;
            }

            let result;
            try {
                if (authMode === 'login') {
                    result = await auth.signInWithPassword({ email, password });
                } else {
                    result = await auth.signUp({ email, password });
                }
            } catch (err) {
                errorEl.textContent = 'Error: ' + err.message;
                errorEl.style.display = 'block';
                return;
            }

            if (result.error) {
                errorEl.textContent = result.error.message;
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
                closeAuthModal();
                updateUserUI(result.data.user);
            }
        }

        async function handleGoogleAuth() {
            if (!supabaseClient) {
                document.getElementById('authError').textContent = 'Not connected. Refresh the page.';
                document.getElementById('authError').style.display = 'block';
                return;
            }

            try {
                const { error } = await auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/openings.html'
                    }
                });
                if (error) {
                    document.getElementById('authError').textContent = error.message;
                    document.getElementById('authError').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('authError').textContent = 'Google Sign-In failed. Please try again.';
                document.getElementById('authError').style.display = 'block';
            }
        }

        async function logout() {
            if (!supabaseClient) return;
            await auth.signOut();
            updateUserUI(null);
        }

        function updateUserUI(user) {
            const menu = document.getElementById('userMenu');
            if (user) {
                const name = user.email.split('@')[0];
                const initial = name.charAt(0).toUpperCase();
                menu.innerHTML = `
                    <span class="nav-user">${name}</span>
                    <div class="nav-avatar">${initial}</div>
                    <button class="btn-logout" onclick="logout()">Log out</button>
                `;
                loadCloudProgress(user.id);
            } else {
                menu.innerHTML = `<button class="btn-login" id="btnLogin" onclick="openAuthModal()">Log in</button>`;
            }
        }

        async function loadCloudProgress(userId) {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('user_progress')
                    .eq('id', userId)
                    .single();
                if (data && data.user_progress) {
                    localStorage.setItem('chesspeps_progress', JSON.stringify(data.user_progress));
                    renderCourses(allOpenings);
                }
            } catch (e) { /* silently ignore */ }
        }

        // Make functions global for inline handlers
        window.handleAuth = handleAuth;
        window.handleGoogleAuth = handleGoogleAuth;
        window.logout = logout;
        window.openAuthModal = openAuthModal;
        window.closeAuthModal = closeAuthModal;
        window.toggleAuthMode = toggleAuthMode;

        // Check existing session
        if (auth) {
            auth.getUser().then(({ data }) => {
                if (data.user) updateUserUI(data.user);
            });
            auth.onAuthStateChange((event, session) => {
                updateUserUI(session?.user || null);
            });
        }
    </script>

</body>
</html>
